name: iOS simulator build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [native/**, js/**, index.html, styles.css, privacy.html, .github/workflows/ios.yml]
jobs:
  simulator:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - working-directory: native
        run: npm ci
      - working-directory: native
        run: npm run build:web
      - working-directory: native
        run: npx cap sync ios
      - working-directory: native
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent native/build/Build/Products/Debug-iphonesimulator/App.app native/ios-simulator-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: native/ios-simulator-app.zip
