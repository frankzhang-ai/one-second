#
# Signing uses ONLY an App Store Connect API key (repo secrets ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_P8). No .p12 certificate or provisioning profile is
# stored anywhere.
#
# Approach: Xcode automatic signing + cloud-managed distribution signing.
#   xcodebuild archive / -exportArchive with -allowProvisioningUpdates and
#   -authenticationKeyPath/-authenticationKeyID/-authenticationKeyIssuerID lets
#   Xcode register the App ID, create/download the App Store provisioning
#   profile and sign the IPA with Apple's *cloud-managed* Apple Distribution
#   certificate. Its private key stays at Apple, so nothing is lost when the
#   ephemeral runner is destroyed and no new distribution certificate piles up
#   each run. The export step uploads straight to App Store Connect
#   (destination=upload), so no altool/Transporter step is needed.
#
# Tradeoffs / limits (why not fastlane cert+sigh):
#   - fastlane `cert`/`get_certificates` on an ephemeral runner creates a NEW
#     Apple Distribution certificate every run (the private key only exists in
#     that run's temp keychain). Apple allows only a few distribution certs per
#     team, so runs start failing until old certs are revoked. fastlane `match`
#     avoids that but needs an extra private git repo + passphrase secret.
#   - Cloud-managed distribution signing needs the API key to have the Admin
#     role (or a role with "Access to Cloud Managed Distribution Certificate").
#     App Manager may be rejected for cloud signing; use Admin if so.
#   - The archive step signs with an Apple Development identity; on a fresh
#     runner Xcode may create a development certificate via the API key. Those
#     are cheap and revocable (Certificates page), but if they accumulate,
#     revoke old "Created via API" development certificates now and then.
#   - The team ID is looked up from the API key (bundle ID seedId); set the
#     optional repo VARIABLE APPLE_TEAM_ID (not a secret) to skip the lookup.
#   - Build number = GitHub run number, so every upload is unique.
#   - Not tested yet: no Apple account exists. Expect to adjust on first run.
