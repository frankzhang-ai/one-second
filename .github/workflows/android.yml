name: Android build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - working-directory: native
        run: npm ci
      - working-directory: native
        run: npm run build:web
      - working-directory: native
        run: npx cap sync android
      - name: Configure optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            printf 'ONESECOND_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            printf 'ONESECOND_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            printf 'ONESECOND_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'ONESECOND_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - working-directory: native/android
        run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            native/android/app/build/outputs/bundle/release/app-release.aab
