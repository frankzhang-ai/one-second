name: iOS Mac bundle (archive + simulator check)
# Builds the self-contained Xcode bundle Frank opens on his Mac, then proves it
# on a CLEAN macOS runner: no checkout, no node, GitHub blocked in /etc/hosts.
# Never signs, never uploads anything to Apple.
on:
  workflow_dispatch:
  push:
    branches: [ci/ios-archive]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - working-directory: native
        run: npm ci --no-audit --no-fund
      - working-directory: native
        run: bash scripts/make-ios-mac-bundle.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: OneSecond-iOS-mac
          path: ${{ runner.temp }}/out/OneSecond-iOS-mac.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ci-autoplay
          path: native/ci/autoplay.js

  verify:
    needs: bundle
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.frankzhang.onesecond
    steps:
      - uses: actions/download-artifact@v4
        with: { name: OneSecond-iOS-mac, path: dl }
      - uses: actions/download-artifact@v4
        with: { name: ci-autoplay, path: ci }
      - name: Unzip into a clean folder and cut off GitHub (proves no package downloads)
        run: |
          mkdir -p "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean" && unzip -q "$GITHUB_WORKSPACE/dl/OneSecond-iOS-mac.zip"
          ls -la OneSecond-iOS
          sudo sh -c 'printf "0.0.0.0 github.com\n0.0.0.0 raw.githubusercontent.com\n0.0.0.0 objects.githubusercontent.com\n0.0.0.0 codeload.github.com\n0.0.0.0 registry.npmjs.org\n" >> /etc/hosts'
          sudo dscacheutil -flushcache || true
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/org.swift.swiftpm || true
          xcodebuild -version
      - name: Unsigned archive (Release, generic iOS device)
        working-directory: ${{ runner.temp }}/clean/OneSecond-iOS
        run: |
          set -o pipefail
          xcodebuild -project App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd-archive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(deprecated|Info.plist)|ARCHIVE" || true
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
      - name: Inspect archived app
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          for k in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion MinimumOSVersion ITSAppUsesNonExemptEncryption UIDeviceFamily UISupportedInterfaceOrientations UIRequiredDeviceCapabilities LSApplicationCategoryType; do
            printf '%s = ' "$k"; /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" | tr '\n' ' '; echo; done | tee "$RUNNER_TEMP/archive-info.txt"
          ls "$APP" | tee -a "$RUNNER_TEMP/archive-info.txt"
          test -f "$APP/PrivacyInfo.xcprivacy"
          ls "$APP/Frameworks" | tee -a "$RUNNER_TEMP/archive-info.txt"
          if grep -R "gc\.zgo\.at\|goatcounter\.com/count" "$APP/public"; then echo "analytics found"; exit 1; fi
          test ! -e "$APP/public/sw.js"
          xcrun assetutil --info "$APP/Assets.car" | grep -E '"(Name|RenditionName|PixelWidth|Opaque)"' | head -20 | tee -a "$RUNNER_TEMP/archive-info.txt" || true
          echo "### Archive OK" >> "$GITHUB_STEP_SUMMARY"; sed 's/^/    /' "$RUNNER_TEMP/archive-info.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Simulator build (throwaway copy with CI autoplay driver)
        run: |
          set -o pipefail
          cp -R "$RUNNER_TEMP/clean/OneSecond-iOS" "$RUNNER_TEMP/simcopy"
          cd "$RUNNER_TEMP/simcopy"
          cp "$GITHUB_WORKSPACE/ci/autoplay.js" App/App/public/js/ci-autoplay.js
          sed -i '' 's#</body>#<script src="./js/ci-autoplay.js"></script></body>#' App/App/public/index.html
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" -c "Add :CFBundleURLTypes:0 dict" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string onesecondci" App/App/Info.plist
          xcodebuild -project App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-sim" CODE_SIGNING_ALLOWED=NO build | tail -3
      - name: Run on simulator (save data, background/foreground, safe area, screenshots)
        timeout-minutes: 25
        run: |
          set -u
          T() { local s=$1; shift; echo "[$(date +%T)] $*"; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; local rc=$?; [ $rc -ne 0 ] && echo "[$(date +%T)] rc=$rc: $*"; return $rc; }
          APP="$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator/App.app"
          OUT="$RUNNER_TEMP/sim"; mkdir -p "$OUT/shots"
          pick() { xcrun simctl list devices available -j | python3 -c "import json,sys;n=sys.argv[1];d=json.load(sys.stdin)['devices'];c=[(r,x['udid']) for r,l in d.items() if 'iOS' in r for x in l if x['name']==n];c.sort();print(c[-1][1] if c else '')" "$1"; }
          UDID=$(pick "iPhone 17 Pro Max"); [ -n "$UDID" ] || UDID=$(pick "iPhone 16 Pro Max")
          echo "device $UDID"; xcrun simctl list devices | grep "$UDID"
          bootit() { T 180 xcrun simctl boot "$1" && T 240 xcrun simctl bootstatus "$1" -b >/dev/null; }
          if ! bootit "$UDID"; then
            echo "boot hung; resetting CoreSimulator and retrying"
            xcrun simctl shutdown all || true; killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true; sleep 5
            ALT=$(pick "iPhone 16 Pro Max"); [ -n "$ALT" ] && UDID=$ALT
            T 120 xcrun simctl erase "$UDID" || true
            bootit "$UDID"
          fi
          T 30 xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          T 120 xcrun simctl install "$UDID" "$APP"
          waitfor() { local f=$1 pat=$2 t=${3:-90}; for i in $(seq 1 $((t*5))); do grep -q "$pat" "$f" 2>/dev/null && { echo "[$(date +%T)] got $pat"; return 0; }; sleep 0.2; done; echo "[$(date +%T)] TIMEOUT waiting for $pat"; tail -5 "$f"; return 1; }
          shot() { T 30 xcrun simctl io "$UDID" screenshot --type=png "$OUT/shots/$1.png" >/dev/null 2>&1 && echo "shot $1"; }
          FAIL=0
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > "$OUT/console1.log" 2>&1 &
          waitfor "$OUT/console1.log" 'CI:boot' 60 || FAIL=1
          waitfor "$OUT/console1.log" 'CI:home' 30 && shot 01-home || FAIL=1
          waitfor "$OUT/console1.log" 'CI:levelup' 90 && { for k in 1 2 3; do shot 02-levelup-$k; done; } || FAIL=1
          waitfor "$OUT/console1.log" 'CI:perfect' 120 && { for k in 1 2 3 4 5 6 7 8; do shot 03-perfect-$k; done; } || FAIL=1
          waitfor "$OUT/console1.log" 'CI:over' 120 && { sleep 0.5; shot 05-game-over; } || FAIL=1
          waitfor "$OUT/console1.log" 'CI:run1-done' 30 || FAIL=1
          sleep 4
          T 30 xcrun simctl terminate "$UDID" "$BUNDLE_ID"; sleep 2
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > "$OUT/console2.log" 2>&1 &
          waitfor "$OUT/console2.log" 'CI:run2 ' 60 || FAIL=1
          waitfor "$OUT/console2.log" 'CI:run2-home' 30 && { sleep 0.5; shot 06-home-after-relaunch; } || FAIL=1
          waitfor "$OUT/console2.log" 'CI:bg-ready' 60 || FAIL=1
          T 60 xcrun simctl launch "$UDID" com.apple.Preferences; sleep 4; shot 90-backgrounded
          waitfor "$OUT/console2.log" 'CI:hidden' 10 || echo "note: no hidden marker"
          T 30 xcrun simctl launch "$UDID" "$BUNDLE_ID" || T 30 xcrun simctl openurl "$UDID" onesecondci://resume
          waitfor "$OUT/console2.log" 'CI:resumed' 30 && { sleep 0.5; shot 04-paused-after-background; } || FAIL=1
          waitfor "$OUT/console2.log" 'CI:bg-done' 30 || FAIL=1
          T 30 xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          grep -h 'CI:' "$OUT"/console*.log | tee "$OUT/markers.txt"
          OVER=$(grep -o 'CI:over score=[0-9]* best=[0-9]*' "$OUT/markers.txt" | head -1)
          RUN2=$(grep -o 'CI:run2 best=[0-9]* soundOn=[a-z]*' "$OUT/markers.txt" | head -1)
          BEST1=$(echo "$OVER" | sed -E 's/.*best=([0-9]+).*/\1/'); BEST2=$(echo "$RUN2" | sed -E 's/.*best=([0-9]+).*/\1/')
          echo "### Simulator ($UDID)" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$OUT/markers.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BEST1" ] && [ "$BEST1" = "$BEST2" ] && echo "$RUN2" | grep -q 'soundOn=false'; then echo "PERSISTENCE OK (best=$BEST1, sound off survived relaunch)" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "PERSISTENCE FAILED" | tee -a "$GITHUB_STEP_SUMMARY"; FAIL=1; fi
          grep -q 'CI:resumed state=paused' "$OUT/markers.txt" && echo "BACKGROUND->FOREGROUND OK (run auto-paused)" | tee -a "$GITHUB_STEP_SUMMARY" || { echo "BACKGROUND CHECK FAILED" | tee -a "$GITHUB_STEP_SUMMARY"; FAIL=1; }
          grep -q 'goatcounter=undefined' "$OUT/markers.txt" && echo "NO ANALYTICS OK" | tee -a "$GITHUB_STEP_SUMMARY" || FAIL=1
          T 60 xcrun simctl shutdown "$UDID" || true
          exit $FAIL
      - name: Small-screen check (iPhone SE / 16e if available)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          APP="$RUNNER_TEMP/dd-sim/Build/Products/Debug-iphonesimulator/App.app"; OUT="$RUNNER_TEMP/sim"; mkdir -p "$OUT/shots"
          for n in "iPhone SE (3rd generation)" "iPhone 16e"; do
            U=$(xcrun simctl list devices available -j | python3 -c "import json,sys;n=sys.argv[1];d=json.load(sys.stdin)['devices'];c=[(r,x['udid']) for r,l in d.items() if 'iOS' in r for x in l if x['name']==n];c.sort();print(c[-1][1] if c else '')" "$n")
            [ -n "$U" ] || continue
            xcrun simctl boot "$U"; xcrun simctl bootstatus "$U" -b >/dev/null; xcrun simctl install "$U" "$APP"
            xcrun simctl launch --console-pty "$U" "$BUNDLE_ID" > "$OUT/small.log" 2>&1 &
            for i in $(seq 1 300); do grep -q 'CI:home' "$OUT/small.log" && break; sleep 0.2; done
            xcrun simctl io "$U" screenshot "$OUT/shots/small-home-${n// /_}.png"
            for i in $(seq 1 450); do grep -q 'CI:levelup' "$OUT/small.log" && break; sleep 0.2; done
            xcrun simctl io "$U" screenshot "$OUT/shots/small-game-${n// /_}.png"
            xcrun simctl shutdown "$U"; break
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            ${{ runner.temp }}/sim
            ${{ runner.temp }}/archive-info.txt
            ${{ runner.temp }}/archive.log
